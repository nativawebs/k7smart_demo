<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Kiosko7 Admin</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/custom.css">
  
  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 15px;
    }
    
    .login-card {
      background: var(--k7-sidebar-bg);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    .login-header {
      background: linear-gradient(135deg, var(--k7-primary) 0%, #ff8555 100%);
      padding: 2rem;
      text-align: center;
      color: white;
    }
    
    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.2);
    }
    
    .login-logo img {
      width: 60px;
      height: auto;
    }
    
    .login-body {
      padding: 2rem;
    }
    
    .form-floating > label {
      color: var(--k7-text-secondary);
    }
    
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .login-footer {
      text-align: center;
      padding: 1rem 2rem 2rem;
      color: var(--k7-text-secondary);
      font-size: 0.875rem;
    }
    
    .alert {
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <img src="https://negociolisto.online/wp-content/uploads/2025/11/logo_k7-3.svg" alt="Kiosko7">
        </div>
        <h4 class="mb-0">Kiosko7 Admin</h4>
        <p class="mb-0 mt-2 opacity-75">Panel de Administración</p>
      </div>
      
      <div class="login-body">
        <div id="alert-container"></div>
        
        <form id="login-form">
          <div class="form-floating mb-3">
            <input 
              type="email" 
              class="form-control" 
              id="email" 
              placeholder="correo@ejemplo.com"
              required
              autocomplete="email"
            >
            <label for="email">
              <i class="bi bi-envelope me-2"></i>Correo Electrónico
            </label>
          </div>
          
          <div class="form-floating mb-3">
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              placeholder="Contraseña"
              required
              autocomplete="current-password"
            >
            <label for="password">
              <i class="bi bi-lock me-2"></i>Contraseña
            </label>
          </div>
          
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember" checked>
            <label class="form-check-label" for="remember">
              Recordar sesión
            </label>
          </div>
          
          <button type="submit" class="btn btn-primary btn-login" id="login-btn">
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Iniciar Sesión
          </button>
        </form>
        
        <div class="text-center mt-3">
          <a href="#" class="text-decoration-none" id="forgot-password">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </div>
      
      <div class="login-footer">
        <p class="mb-0">
          <i class="bi bi-shield-check me-1"></i>
          Acceso seguro con Supabase Auth
        </p>
      </div>
    </div>
    
    <div class="text-center mt-4">
      <p class="text-white mb-0">
        <small>&copy; 2025 Kiosko7. Todos los derechos reservados.</small>
      </p>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Login Script -->
  <script type="module">
    import { signIn, redirectAfterLogin, isAuthenticated, initSupabase } from './js/modules/auth.js';
    import { showToast } from './js/modules/utils.js';
    
    // Initialize Supabase
    // Replace with your actual credentials or load from config
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    // Try to load from config file if exists
    try {
      const configModule = await import('./js/config.js');
      if (configModule.config) {
        initSupabase(configModule.config.supabaseUrl, configModule.config.supabaseAnonKey);
      }
    } catch (e) {
      // Config file doesn't exist, use defaults
      initSupabase(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    
    // Check if already authenticated
    const authenticated = await isAuthenticated();
    if (authenticated) {
      redirectAfterLogin();
    }
    
    // Handle form submission
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const alertContainer = document.getElementById('alert-container');
    
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Disable button
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Iniciando sesión...';
      
      // Clear previous alerts
      alertContainer.innerHTML = '';
      
      try {
        const result = await signIn(email, password);
        
        if (result.success) {
          // Show success message
          alertContainer.innerHTML = `
            <div class="alert alert-success alert-dismissible fade show" role="alert">
              <i class="bi bi-check-circle me-2"></i>
              Sesión iniciada correctamente. Redirigiendo...
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          `;
          
          // Redirect after short delay
          setTimeout(() => {
            redirectAfterLogin();
          }, 1000);
        } else {
          // Show error message
          alertContainer.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle me-2"></i>
              ${result.error?.message || 'Error al iniciar sesión. Verifica tus credenciales.'}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          `;
          
          // Re-enable button
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión';
        }
      } catch (error) {
        console.error('Login error:', error);
        
        alertContainer.innerHTML = `
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Error inesperado. Por favor, intenta nuevamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        `;
        
        // Re-enable button
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión';
      }
    });
    
    // Handle forgot password
    document.getElementById('forgot-password').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Funcionalidad de recuperación de contraseña próximamente', 'info');
    });
    
    // Handle Enter key on inputs
    document.getElementById('email').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
